name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行测试
        run: python -m pytest -q

  addon-metadata:
    # 校验 HA Add-on 仓库清单与 config.yaml，元数据有误会直接装不上
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyYAML
        run: pip install pyyaml

      - name: 校验 repository.yaml 与 bridge/config.yaml
        run: python scripts/check_addon.py
